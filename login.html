<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Picker Shop BD</title>

<meta name="description" content="Login to your Picker Shop BD account">

<meta name="theme-color" content="#16a34a">

<link rel="icon" href="images/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/auth.css">

<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<!--========== Preloader ==========-->

<div id="preloader">

<div class="loader"></div>

</div>

<!--========== Header ==========-->

<header class="header">

<div class="container">

<a href="index.html" class="logo">

<img src="images/logo.png" alt="Picker Shop BD">

</a>

<nav class="navbar">

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="products.html">Products</a></li>

<li><a href="login.html" class="active">Login</a></li>

</ul>

</nav>

</div>

</header>

<!--========== Login Section ==========-->

<section class="auth-section">

<div class="container">

<div class="auth-wrapper">

<div class="auth-left">

<h2>Welcome Back</h2>

<p>

Login to access your account, orders, wishlist and exclusive offers.

</p>

<img src="images/login-banner.png" alt="Login">

</div>

<div class="auth-right">

<h2>Login</h2>

<p>

Please enter your account details.

</p>

<form id="loginForm">

<div class="form-group">

<label>Email Address</label>

<input

type="email"

id="loginEmail"

placeholder="Enter your email"

required>

</div>

<div class="form-group">

<label>Password</label>

<div class="password-box">

<input

type="password"

id="loginPassword"

placeholder="Enter your password"

required>

<button

type="button"

id="togglePassword">

<i class="fas fa-eye"></i>

</button>

</div>

</div>

<div class="form-options">

<label>

<input type="checkbox" id="rememberMe">

Remember Me

</label>

<a href="forgot-password.html">

Forgot Password?

</a>

</div>

<button

type="submit"

class="btn auth-btn">

Login

</button>

<div class="divider">

<span>OR</span>

</div>

<button

type="button"

id="googleLogin"

class="google-btn">

<i class="fab fa-google"></i>

Continue with Google

</button>

<p class="auth-link">

Don't have an account?

<a href="register.html">

Create Account

</a>

</p>

</form>

</div>

</div>

</div>

</section>
