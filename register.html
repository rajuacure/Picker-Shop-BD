<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Picker Shop BD</title>

<meta name="description" content="Create your Picker Shop BD account">

<meta name="theme-color" content="#16a34a">

<link rel="icon" href="images/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/auth.css">

<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<!--========== Preloader ==========-->

<div id="preloader">

<div class="loader"></div>

</div>

<!--========== Header ==========-->

<header class="header">

<div class="container">

<a href="index.html" class="logo">

<img src="images/logo.png" alt="Picker Shop BD">

</a>

<nav class="navbar">

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="products.html">Products</a></li>

<li><a href="register.html" class="active">Register</a></li>

</ul>

</nav>

</div>

</header>

<!--========== Register Section ==========-->

<section class="auth-section">

<div class="container">

<div class="auth-wrapper">

<!-- Left Side -->

<div class="auth-left">

<h2>

Join Picker Shop BD

</h2>

<p>

Create your account to enjoy faster checkout, order tracking, wishlist and exclusive offers.

</p>

<img

src="images/register-banner.png"

alt="Register">

</div>

<!-- Right Side -->

<div class="auth-right">

<h2>

Create Account

</h2>

<p>

Fill in your information below.

</p>

<form id="registerForm">

<div class="form-group">

<label>

Full Name

</label>

<input

type="text"

id="registerName"

placeholder="Enter your full name"

required>

</div>

<div class="form-group">

<label>

Email Address

</label>

<input

type="email"

id="registerEmail"

placeholder="Enter your email"

required>

</div>

<div class="form-group">

<label>

Phone Number

</label>

<input

type="tel"

id="registerPhone"

placeholder="01XXXXXXXXX"

required>

</div>

<div class="form-group">

<label>

Password

</label>

<div class="password-box">

<input

type="password"

id="registerPassword"

placeholder="Create a password"

required>

<button

type="button"

id="toggleRegisterPassword">

<i class="fas fa-eye"></i>

</button>

</div>

</div>

<div class="form-group">

<label>

Confirm Password

</label>

<div class="password-box">

<input

type="password"

id="confirmPassword"

placeholder="Confirm password"

required>

<button

type="button"

id="toggleConfirmPassword">

<i class="fas fa-eye"></i>

</button>

</div>

</div>

<label class="checkbox">

<input

type="checkbox"

id="agreeTerms"

required>

<span>

I agree to the

<a href="terms.html">

Terms & Conditions

</a>

and

<a href="privacy.html">

Privacy Policy

</a>

</span>

</label>

<button

type="submit"

class="btn auth-btn">

Create Account

</button>

<div class="divider">

<span>

OR

</span>

</div>

<button

type="button"

id="googleRegister"

class="google-btn">

<i class="fab fa-google"></i>

Continue with Google

</button>

<p class="auth-link">

Already have an account?

<a href="login.html">

Login Now

</a>

</p>

</form>

</div>

</div>

</div>

</section>
